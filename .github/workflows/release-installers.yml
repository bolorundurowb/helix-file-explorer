name: Release

on:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read version from Directory.Build.props
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version')?.InnerText
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Directory.Build.props must define Project/PropertyGroup/Version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check
        shell: pwsh
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          if (git tag -l $tag) {
            Write-Host "Tag $tag already exists, skipping release."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }

      - name: Setup .NET
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        if: steps.check.outputs.skip != 'true'
        run: dotnet restore HelixExplorer.slnx

      - name: Run tests
        if: steps.check.outputs.skip != 'true'
        run: dotnet test HelixExplorer.slnx -c Release

      - name: Publish application
        if: steps.check.outputs.skip != 'true'
        run: >-
          dotnet publish src/HelixExplorer/HelixExplorer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=embedded
          -o publish/win-x64

      - name: Setup PolyInstall
        if: steps.check.outputs.skip != 'true'
        uses: bolorundurowb/PolyInstall/.github/actions/setup-polyinstall@06ad773af4c3da0dae2735353ff480dcf7638b17 # v2.0.1
        with:
          version: v2.1.1
          rid: win-x64

      - name: Validate manifest
        if: steps.check.outputs.skip != 'true'
        env:
          HELIX_VERSION: ${{ steps.version.outputs.version }}
          POLYINSTALL_TARGET: windows-x64
        run: polyinstall validate installer/helix-explorer.install.yaml --base .

      - name: Build installer
        if: steps.check.outputs.skip != 'true'
        env:
          HELIX_VERSION: ${{ steps.version.outputs.version }}
          POLYINSTALL_TARGET: windows-x64
        run: polyinstall build installer/helix-explorer.install.yaml --base .

      - name: Verify installer artifacts
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path dist -File -Recurse -ErrorAction SilentlyContinue
          if (-not $artifacts) {
            throw "PolyInstall did not produce any files in dist."
          }
          $artifacts | ForEach-Object { Write-Host "Installer artifact: $($_.FullName)" }

      - name: Generate SHA-256 checksums
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $dist = (Resolve-Path dist).Path
          $lines = Get-ChildItem -Path $dist -File -Recurse |
            Sort-Object FullName |
            ForEach-Object {
              $relativePath = [System.IO.Path]::GetRelativePath($dist, $_.FullName).Replace('\', '/')
              "$(Get-FileHash -Path $_.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $relativePath"
            }
          if (-not $lines) {
            throw "No release artifacts were available for checksum generation."
          }
          $lines | Set-Content -Path (Join-Path $dist 'SHA256SUMS.txt') -Encoding utf8NoBOM

      - name: Attest release artifacts
        if: steps.check.outputs.skip != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS.txt

      - name: Create release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: dist/**
          fail_on_unmatched_files: true
          generate_release_notes: true
